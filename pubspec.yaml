name: novinarko
description: News app made in Flutter
publish_to: 'none'
version: 1.6.1+161

#
# DEPLOYING APP
# 1. `pubspec.yaml` -> Bump version number
# 2. `release_notes.txt` -> Update changelog for all languages
# 3. `default.txt` -> Update changelog for all languages
#

#
# Android
# `cd android/ && fastlane play_store_release`
#
# GitHub Releases
# `cd android/ && fastlane github_release`
#
# iOS
# `cd ios/ && fastlane app_store_release`
#

environment:
  sdk: 3.9.0

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: 3.4.1
  dio: 5.9.0
  dough: 2.0.0
  easy_localization: 3.0.8
  envied: 1.2.0
  flutter_animate: 4.5.2
  flutter_inappwebview: 6.1.5
  flutter_swipe_action_cell: 3.1.5
  flutter_web_browser: 0.17.3
  get_it: 8.2.0
  hive_ce: 2.11.3
  hive_ce_flutter: 2.3.1
  html: 0.15.6
  internet_connection_checker_plus: 2.7.2
  intl: 0.20.2
  just_audio: 0.10.4
  loading_animation_widget: 1.3.0
  logger: 2.6.1
  package_info_plus: 8.3.1
  path_provider: 2.1.5
  preload_page_view: 0.2.0
  sentry_flutter: 9.6.0
  share_plus: 11.1.0
  timeago: 3.7.1
  url_launcher: 6.3.2
  watch_it: 1.6.5
  xml: 6.6.0

dev_dependencies:
  build_runner: 2.7.0
  envied_generator: 1.2.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.6
  hive_ce_generator: 1.9.3

dependency_overrides:
  meta: 1.17.0

# Run code generation - `dart run build_runner build -d`

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/fonts/
    - assets/icons/
    - assets/translations/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700

    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather/Merriweather-Bold.ttf
          weight: 700

# Configuration for 'flutter_launcher_icons'
# Run icon generation with 'dart run flutter_launcher_icons:main'
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon.png'
  min_sdk_android: 21
  adaptive_icon_background: '#748479'
  adaptive_icon_foreground: 'assets/icon.png'
  web:
    generate: true
    image_path: 'assets/icon.png'
    background_color: '#748479'
    theme_color: '#748479'
  windows:
    generate: true
    image_path: 'assets/icon.png'
    icon_size: 48
  macos:
    generate: true
    image_path: 'assets/icon.png'

# Configuration for 'flutter_native_splash'
# Run splash screen generation with 'dart run flutter_native_splash:create'
flutter_native_splash:
  background_image: "assets/splash.png"
  android_12:
    image: assets/splash_icon.png
    color: "#748479"
    image_dark: assets/splash_icon.png
    color_dark: "#748479"
